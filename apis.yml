name: Financial Modeling Prep
kind: company
description: Financial Modeling Prep (FMP) is a financial data API provider offering
  real-time and historical market data, company fundamentals, and regulatory filings
  through more than 100 REST endpoints plus real-time WebSocket streams. Coverage
  includes income statements, balance sheets, and cash-flow statements; stock, ETF,
  index, forex, crypto, and commodity quotes; up to 30 years of historical prices;
  SEC filings (10-K, 10-Q, 8-K); analyst estimates and price targets; key metrics,
  ratios, and enterprise values; and macroeconomic indicators such as GDP, treasury
  rates, and inflation. Data is delivered as JSON or CSV over the stable REST base
  (financialmodelingprep.com/stable) with API-key authentication, and a free tier
  allows up to 250 requests per day.
