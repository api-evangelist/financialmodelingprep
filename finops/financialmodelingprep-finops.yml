description: >-
  FinOps view of Financial Modeling Prep spend. FMP is a subscription-based
  financial data API. Cost is driven by which plan tier an account holds
  (Basic/free, Starter, Premium, Ultimate, or Enterprise), which sets the
  request-rate ceiling, the trailing 30-day bandwidth allowance, data recency,
  historical depth, market coverage, and access to premium datasets. Unlike
  pure usage-metered APIs, FMP bills a recurring subscription rather than
  per-request; the practical cost lever is choosing the smallest tier whose
  rate limit and bandwidth allowance cover the workload, and controlling
  bandwidth via bulk endpoints and caching.
notes: >-
  Exact per-tier prices are not reconciled here and must be verified on the FMP
  pricing page. Annual billing is discounted versus monthly. Bandwidth
  (trailing 30 days) is a real cost dimension distinct from request count.
