alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Financial Modeling Prep
serviceCategory: Financial Data and Market Data
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly or Annual
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
meters:
- name: subscription_tier
  description: Recurring subscription fee for the selected plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: api_requests
  description: REST requests consumed, bounded by the plan's per-day or per-minute rate limit.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: bandwidth
  description: Response bytes transferred, counted against the plan's trailing 30-day bandwidth allowance.
  unit: bytes
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track request volume and response bandwidth against the plan's per-minute rate cap and trailing 30-day bandwidth allowance to anticipate throttling.
- name: Allocation
  description: Attribute the subscription and its request/bandwidth budget to the teams or products consuming FMP data.
- name: Optimization
  description: Right-size the plan to the smallest tier that meets rate and bandwidth needs; prefer bulk endpoints, cache slowly-changing fundamentals, and constrain historical pulls to needed date ranges.
- name: Accountability
  description: Review monthly whether the tier still matches usage; downgrade or upgrade based on observed request-rate and bandwidth consumption.
